version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on: [postgres]
  frontend:
    build: ./frontend
    restart: always
    environment: { NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL} }
    depends_on: [backend]
volumes: { pgdata: }
